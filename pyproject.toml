[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "persian-llm-benchmark"
version = "1.0.0"
description = "A Rigorous Academic Benchmark for Evaluating Reasoning, Knowledge, and Hallucination in Large Language Models for Persian (Farsi)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Aria Esmaeilzadeh", email = "aria.esm@gmail.com" },
]
keywords = [
  "nlp",
  "llm-evaluation",
  "benchmarking",
  "persian-nlp",
  "farsi",
  "reasoning",
  "hallucination-detection",
  "multilingual-nlp",
  "academic-research",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "numpy>=1.24.0",
  "pydantic>=2.0.0",
  "tqdm>=4.65.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0.0",
]
api = [
  "httpx>=0.24.0",
]

[project.scripts]
persian-bench = "persian_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/persian_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
